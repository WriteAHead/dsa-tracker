name: Sync DSA Submissions

on:
  schedule:
    - cron: '0 0 * * *' # Automatically runs every night at midnight UTC
  workflow_dispatch: # Allows manual one-click sync anytime

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Installs all required packages in a single fast command
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sync Script
        env:
          CF_USERNAME: "writeAhead"
          LC_USERNAME: "writeAhead"
        run: python sync_submissions.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git status --porcelain | grep -q .; then
            git commit -m "auto: sync latest LeetCode & Codeforces submissions"
            git push
          else
            echo "No new submissions found."
          fi